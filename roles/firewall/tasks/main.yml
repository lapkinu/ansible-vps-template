---
- name: Install firewall packages
  ansible.builtin.apt:
    name:
      - iptables
      - conntrack
      - nftables
    state: present
    update_cache: true

- name: Ensure iptables configuration directory exists
  ansible.builtin.file:
    path: /etc/iptables
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Docker user firewall rules
  ansible.builtin.template:
    src: docker-user-firewall.rules.j2
    dest: /etc/iptables/docker-user.rules
    owner: root
    group: root
    mode: "0644"
  notify: Restart Docker user firewall

- name: Install Docker user IPv6 firewall rules
  ansible.builtin.template:
    src: docker-user-firewall-v6.rules.j2
    dest: /etc/iptables/docker-user-v6.rules
    owner: root
    group: root
    mode: "0644"
  notify: Restart Docker user firewall

- name: Install Docker user firewall script
  ansible.builtin.template:
    src: docker-user-firewall.sh.j2
    dest: /usr/local/sbin/docker-user-firewall.sh
    owner: root
    group: root
    mode: "0755"
  notify: Restart Docker user firewall

- name: Install Docker user firewall systemd service
  ansible.builtin.template:
    src: docker-user-firewall.service.j2
    dest: /etc/systemd/system/docker-user-firewall.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart Docker user firewall

- name: Enable and start Docker user firewall service
  ansible.builtin.systemd:
    name: docker-user-firewall.service
    enabled: true
    state: started
    daemon_reload: true

- name: Check for legacy nftables table
  ansible.builtin.command:
    cmd: /usr/sbin/nft list table inet filter
  register: legacy_nftables_table
  changed_when: false
  failed_when: false

- name: Remove legacy nftables table
  ansible.builtin.command:
    cmd: /usr/sbin/nft delete table inet filter
  when: legacy_nftables_table.rc == 0

- name: Deploy nftables configuration
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    validate: "/usr/sbin/nft -c -f %s"
  notify: Reload nftables

- name: Remove obsolete nftables systemd override
  ansible.builtin.file:
    path: /etc/systemd/system/nftables.service.d/override.conf
    state: absent

- name: Enable and start nftables
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started
    daemon_reload: true
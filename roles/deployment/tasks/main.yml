---
- name: Create deployment directory
  ansible.builtin.file:
    path: "{{ deployment_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install production Compose configuration
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ deployment_root }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"